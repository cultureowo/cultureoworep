name: Lab 9 CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          if-no-files-found: error
          retention-days: 14

  unit:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: mkdir -p reports
      - run: npm run test:unit -- --ci --json --outputFile=reports/unit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-report
          path: reports/
          if-no-files-found: error
          retention-days: 14

  integration-api:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: delivery_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d delivery_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: delivery_ci
      DB_USER: ci_user
      DB_PASSWORD: ci_password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: mkdir -p reports
      - run: npm run test:integration -- --ci --json --outputFile=reports/integration-api.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-api-report
          path: reports/
          if-no-files-found: error
          retention-days: 14
